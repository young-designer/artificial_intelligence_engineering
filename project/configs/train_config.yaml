project:
  name: delivery-delay-risk-service
  random_seed: 42

data:
  rows: 6500
  raw_dataset_path: data/delivery_orders_synthetic.csv
  id_column: order_id
  target_column: is_late_delivery
  train_split: 0.8

features:
  numeric:
    - order_value
    - items_count
    - delivery_distance_km
    - promised_hours
    - minutes_since_order
    - warehouse_backlog
    - courier_experience_months
    - courier_load_today
    - historical_late_rate
    - previous_failed_deliveries
    - address_quality_score
    - route_complexity
    - customer_priority_score
  categorical:
    - delivery_type
    - region_type
    - payment_type
    - package_size
    - traffic_level
    - weather_condition
    - dispatch_shift
  boolean:
    - is_weekend
    - is_holiday
    - fragile_item
    - requires_call_before_delivery

training:
  selection_metric: f1
  decision_threshold: 0.5
  test_size: 0.2
  models:
    logistic_regression:
      max_iter: 1200
      class_weight: balanced
      solver: lbfgs
    random_forest:
      n_estimators: 260
      max_depth: 10
      min_samples_leaf: 8
      class_weight: balanced
      random_state: 42
      n_jobs: 1
    gradient_boosting:
      n_estimators: 180
      learning_rate: 0.06
      max_depth: 3
      random_state: 42
